name: CatalogAPI CI/CD

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: catalog-api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore tests/FiapCloudGames.CatalogApi.Tests/FiapCloudGames.CatalogApi.Tests.csproj
      - name: Build
        run: dotnet build tests/FiapCloudGames.CatalogApi.Tests/FiapCloudGames.CatalogApi.Tests.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/FiapCloudGames.CatalogApi.Tests/FiapCloudGames.CatalogApi.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=catalog-tests.trx"

  container-and-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      LOCAL_IMAGE: fcg-catalog-api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Build versioned image
        run: docker build --tag "$LOCAL_IMAGE" .
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Push versioned and stable tags to ACR
        env:
          REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}
          REPOSITORY: ${{ vars.ACR_REPOSITORY }}
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"
          IMAGE="$REGISTRY/$REPOSITORY:${{ github.sha }}"
          docker tag "$LOCAL_IMAGE" "$IMAGE"
          docker tag "$LOCAL_IMAGE" "$REGISTRY/$REPOSITORY:latest"
          docker push "$IMAGE"
          docker push "$REGISTRY/$REPOSITORY:latest"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Install kubelogin
        uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: v0.2.22
      - name: Set AKS context
        uses: azure/aks-set-context@v5
        with:
          resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}
          admin: "false"
          use-kubelogin: "true"
      - name: Deploy rolling update to AKS
        run: |
          kubectl --namespace fcg set image deployment/catalog-api catalog-api="$IMAGE"
          kubectl --namespace fcg rollout status deployment/catalog-api --timeout=5m
